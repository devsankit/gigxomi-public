server {
    server_name www.gigxomi.com;

    # The webinar has moved to its own canonical subdomain to avoid duplicate
    # content being indexed on both hosts.
    location = /webinar {
        return 301 https://ankit.gigxomi.com/;
    }

    # Keep every public route on the canonical host. Legacy campaign paths are
    # handled by Next.js so their permanent redirects resolve on www.gigxomi.com.
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gigxomi.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gigxomi.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_name gigxomi.com;

    # Legacy mobile builds post directly to the apex host. A 301 may replay
    # those requests as GET and yields a 405 from Next.js, so API redirects
    # explicitly preserve the request method and body.
    location ^~ /api/ {
        return 308 https://www.gigxomi.com$request_uri;
    }

    location / {
        return 301 https://www.gigxomi.com$request_uri;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/gigxomi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gigxomi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name gigxomi.com www.gigxomi.com;
    return 301 https://www.gigxomi.com$request_uri;
}
