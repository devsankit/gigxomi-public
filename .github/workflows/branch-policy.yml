name: Branch Policy

on:
  push:
    branches:
      - codex/mobile-app
  pull_request:
    branches:
      - main
      - codex/mobile-app
  workflow_dispatch:

concurrency:
  group: branch-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enforce branch ownership
        run: node scripts/branch-policy-check.mjs --strict
