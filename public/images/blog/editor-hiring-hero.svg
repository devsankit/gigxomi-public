<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="50%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#03060C"/>
    </linearGradient>
    <radialGradient id="cyan-glow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lime-glow" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#D7FF2F" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#cyan-glow)"/>
  <rect width="1200" height="630" fill="url(#lime-glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Brand Watermark & Tag -->
  <g transform="translate(80, 70)">
    <rect width="150" height="32" rx="16" fill="#06B6D4" fill-opacity="0.1" stroke="#06B6D4" stroke-width="1"/>
    <text x="75" y="21" fill="#22D3EE" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">CURATED ROSTER</text>
  </g>

  <!-- Headline -->
  <text x="80" y="150" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.5">HIRING &amp; CAPACITY</text>
  <text x="80" y="200" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500">How Agencies Vet, Test &amp; Delegate to Video Editors Safely</text>

  <!-- 4 Vetting Gate Cards -->
  <g transform="translate(80, 250)">
    <!-- Gate 1: Portfolio -->
    <rect x="0" y="0" width="240" height="280" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    <rect x="20" y="20" width="8" height="8" rx="4" fill="#06B6D4"/>
    <text x="36" y="28" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">GATE 1: AUDIT</text>
    <text x="20" y="65" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Niche-Fit Reel</text>
    <text x="20" y="95" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">• Specific format mastery</text>
    <text x="20" y="118" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">• Cut density &amp; pacing</text>
    <text x="20" y="141" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">• Audio &amp; SFX balancing</text>
    <text x="20" y="164" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">• Reject generalist reels</text>
    <rect x="20" y="220" width="200" height="36" rx="8" fill="#06B6D4" fill-opacity="0.1"/>
    <text x="120" y="243" fill="#22D3EE" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Pass Rate: 15%</text>

    <!-- Arrow -->
    <path d="M 250 140 L 265 140" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>

    <!-- Gate 2: Paid Test -->
    <rect x="275" y="0" width="240" height="280" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    <rect x="295" y="20" width="8" height="8" rx="4" fill="#3B82F6"/>
    <text x="311" y="28" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">GATE 2: TRIAL</text>
    <text x="295" y="65" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Paid Test Edit</text>
    <text x="295" y="95" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">• 60-second raw brief</text>
    <text x="295" y="118" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">• 24-hr turnaround check</text>
    <text x="295" y="141" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">• Style guide adherence</text>
    <text x="295" y="164" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">• Fairly compensated</text>
    <rect x="295" y="220" width="200" height="36" rx="8" fill="#3B82F6" fill-opacity="0.1"/>
    <text x="395" y="243" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Speed &amp; Quality Test</text>

    <!-- Arrow -->
    <path d="M 525 140 L 540 140" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>

    <!-- Gate 3: Two-Lane Setup -->
    <rect x="550" y="0" width="240" height="280" rx="12" fill="url(#card-grad)" stroke="#6366F1" stroke-opacity="0.5" stroke-width="1"/>
    <rect x="570" y="20" width="8" height="8" rx="4" fill="#818CF8"/>
    <text x="586" y="28" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">GATE 3: SECURITY</text>
    <text x="570" y="65" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Masked Privacy</text>
    <text x="570" y="95" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">• Client contact hidden</text>
    <text x="570" y="118" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">• Anti-poaching enforced</text>
    <text x="570" y="141" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">• Internal backchannel</text>
    <text x="570" y="164" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">• Studio ownership sealed</text>
    <rect x="570" y="220" width="200" height="36" rx="8" fill="#6366F1" fill-opacity="0.1"/>
    <text x="670" y="243" fill="#A5B4FC" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Zero Poach Risk</text>

    <!-- Arrow -->
    <path d="M 800 140 L 815 140" stroke="#D7FF2F" stroke-width="2" stroke-linecap="round"/>

    <!-- Gate 4: Roster Active -->
    <rect x="825" y="0" width="215" height="280" rx="12" fill="url(#card-grad)" stroke="#D7FF2F" stroke-width="1.5"/>
    <rect x="845" y="20" width="8" height="8" rx="4" fill="#D7FF2F"/>
    <text x="861" y="28" fill="#D7FF2F" font-family="system-ui, sans-serif" font-size="12" font-weight="700">GATE 4: SCALE</text>
    <text x="845" y="65" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Active Roster</text>
    <text x="845" y="95" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13">• Capacity on demand</text>
    <text x="845" y="118" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13">• Fast task dispatch</text>
    <text x="845" y="141" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13">• 0% platform fee</text>
    <text x="845" y="164" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13">• Reliable delivery SLA</text>
    <rect x="845" y="220" width="175" height="36" rx="8" fill="#D7FF2F"/>
    <text x="932" y="243" fill="#0B0F17" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">ROSTER DEPLOYED</text>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(80, 565)">
    <text x="0" y="20" fill="#64748B" font-family="system-ui, sans-serif" font-size="13">CAPACITY: SPECIALIST ROSTER</text>
    <text x="350" y="20" fill="#64748B" font-family="system-ui, sans-serif" font-size="13">PROTECTION: MASKED PRIVACY</text>
    <text x="650" y="20" fill="#64748B" font-family="system-ui, sans-serif" font-size="13">COMMISSION: 0% ON GIGXOMI</text>
    <text x="970" y="20" fill="#D7FF2F" font-family="system-ui, sans-serif" font-size="13" font-weight="700">GIGXOMI.COM</text>
  </g>
</svg>
