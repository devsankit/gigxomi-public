<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="50%" stop-color="#090D18"/>
      <stop offset="100%" stop-color="#04060B"/>
    </linearGradient>
    <radialGradient id="indigo-glow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lime-glow" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#D7FF2F" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#indigo-glow)"/>
  <rect width="1200" height="630" fill="url(#lime-glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Brand Watermark & Tag -->
  <g transform="translate(80, 70)">
    <rect width="165" height="32" rx="16" fill="#6366F1" fill-opacity="0.1" stroke="#6366F1" stroke-width="1"/>
    <text x="82" y="21" fill="#818CF8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">TWO-LANE ENGINE</text>
  </g>

  <!-- Headline -->
  <text x="80" y="150" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.5">CLIENT MANAGEMENT</text>
  <text x="80" y="200" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500">Anti-Poaching Privacy, Kanban Boards &amp; Revision Systems</text>

  <!-- 5-Stage Kanban Board Visual -->
  <g transform="translate(80, 250)">
    <!-- Stage 1: Inbound -->
    <rect x="0" y="0" width="190" height="280" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    <rect x="14" y="14" width="8" height="8" rx="4" fill="#38BDF8"/>
    <text x="28" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">INBOUND</text>
    <rect x="14" y="44" width="162" height="60" rx="8" fill="#0B0F17" stroke="#1E293B"/>
    <text x="24" y="68" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Fitness Brand Reel</text>
    <text x="24" y="88" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">WhatsApp • ₹24k</text>
    <rect x="14" y="114" width="162" height="60" rx="8" fill="#0B0F17" stroke="#1E293B"/>
    <text x="24" y="138" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Podcast Ep. 42</text>
    <text x="24" y="158" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Instagram • $800</text>

    <!-- Stage 2: Quotation -->
    <rect x="210" y="0" width="190" height="280" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    <rect x="224" y="14" width="8" height="8" rx="4" fill="#F59E0B"/>
    <text x="238" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">QUOTATION</text>
    <rect x="224" y="44" width="162" height="60" rx="8" fill="#0B0F17" stroke="#1E293B"/>
    <text x="234" y="68" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">SaaS Demo Cut</text>
    <text x="234" y="88" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="11">Quote Sent • 50% Adv</text>

    <!-- Stage 3: In Production -->
    <rect x="420" y="0" width="190" height="280" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    <rect x="434" y="14" width="8" height="8" rx="4" fill="#818CF8"/>
    <text x="448" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">IN PROGRESS</text>
    <rect x="434" y="44" width="162" height="75" rx="8" fill="#0B0F17" stroke="#6366F1" stroke-opacity="0.4"/>
    <text x="444" y="68" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">YouTube Long-Form</text>
    <text x="444" y="88" fill="#818CF8" font-family="system-ui, sans-serif" font-size="11">Editor: Masked #4</text>
    <text x="444" y="105" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">🔒 Client Phone Encrypted</text>

    <!-- Stage 4: Review -->
    <rect x="630" y="0" width="190" height="280" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    <rect x="644" y="14" width="8" height="8" rx="4" fill="#EC4899"/>
    <text x="658" y="22" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">CLIENT REVIEW</text>
    <rect x="644" y="44" width="162" height="60" rx="8" fill="#0B0F17" stroke="#1E293B"/>
    <text x="654" y="68" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">UGC Ad Variant B</text>
    <text x="654" y="88" fill="#EC4899" font-family="system-ui, sans-serif" font-size="11">Round 1/2 Feedback</text>

    <!-- Stage 5: Delivered -->
    <rect x="840" y="0" width="200" height="280" rx="10" fill="url(#card-grad)" stroke="#D7FF2F" stroke-width="1.5"/>
    <rect x="854" y="14" width="8" height="8" rx="4" fill="#D7FF2F"/>
    <text x="868" y="22" fill="#D7FF2F" font-family="system-ui, sans-serif" font-size="12" font-weight="700">DELIVERED</text>
    <rect x="854" y="44" width="172" height="75" rx="8" fill="#0B0F17" stroke="#D7FF2F" stroke-opacity="0.3"/>
    <text x="864" y="68" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Brand Retainer Pack</text>
    <text x="864" y="88" fill="#34D399" font-family="system-ui, sans-serif" font-size="11">✓ Approved &amp; Paid</text>
    <text x="864" y="105" fill="#D7FF2F" font-family="system-ui, sans-serif" font-size="10">Auto-Renewal Locked</text>
    <rect x="854" y="220" width="172" height="36" rx="8" fill="#D7FF2F"/>
    <text x="940" y="243" fill="#0B0F17" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">ZERO CHAOS</text>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(80, 565)">
    <text x="0" y="20" fill="#64748B" font-family="system-ui, sans-serif" font-size="13">WORKFLOW: 5-STAGE KANBAN</text>
    <text x="350" y="20" fill="#64748B" font-family="system-ui, sans-serif" font-size="13">SECURITY: ANTI-POACHING ACTIVE</text>
    <text x="650" y="20" fill="#64748B" font-family="system-ui, sans-serif" font-size="13">PERMISSION: FOUNDER / MGR / EDITOR</text>
    <text x="970" y="20" fill="#D7FF2F" font-family="system-ui, sans-serif" font-size="13" font-weight="700">GIGXOMI.COM</text>
  </g>
</svg>
