<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="50%" stop-color="#070A10"/>
      <stop offset="100%" stop-color="#040609"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#D7FF2F" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan-glow" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2937" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#cyan-glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Brand Watermark & Tag -->
  <g transform="translate(80, 70)">
    <rect width="130" height="32" rx="16" fill="#D7FF2F" fill-opacity="0.1" stroke="#D7FF2F" stroke-width="1"/>
    <text x="65" y="21" fill="#D7FF2F" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">GIGXOMI B2B</text>
  </g>

  <!-- Headline -->
  <text x="80" y="150" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.5">CLIENT ACQUISITION</text>
  <text x="80" y="200" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500">Video Editing Agency Inbound &amp; Outreach Engine</text>

  <!-- Acquisition Funnel Cards -->
  <g transform="translate(80, 250)">
    <!-- Stage 1 -->
    <rect x="0" y="0" width="220" height="280" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    <rect x="16" y="20" width="8" height="8" rx="4" fill="#D7FF2F"/>
    <text x="32" y="28" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1. OMNICHANNEL</text>
    <text x="16" y="65" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Unified Inbound</text>
    <text x="16" y="95" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">WhatsApp Business</text>
    <text x="16" y="118" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Instagram Graph DM</text>
    <text x="16" y="141" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Cold Email / DMs</text>
    <rect x="16" y="220" width="188" height="36" rx="8" fill="#D7FF2F" fill-opacity="0.1"/>
    <text x="110" y="243" fill="#D7FF2F" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Zero App Installs</text>

    <!-- Arrow -->
    <path d="M 235 140 L 250 140" stroke="#D7FF2F" stroke-width="2" stroke-linecap="round"/>

    <!-- Stage 2 -->
    <rect x="265" y="0" width="220" height="280" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    <rect x="281" y="20" width="8" height="8" rx="4" fill="#00F0FF"/>
    <text x="297" y="28" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="13" font-weight="700">2. QUALIFY</text>
    <text x="281" y="65" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Deal Manager</text>
    <text x="281" y="95" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Budget Filtering</text>
    <text x="281" y="118" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Scope Scored</text>
    <text x="281" y="141" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Quotation Prepared</text>
    <rect x="281" y="220" width="188" height="36" rx="8" fill="#00F0FF" fill-opacity="0.1"/>
    <text x="375" y="243" fill="#00F0FF" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Fast Qualification</text>

    <!-- Arrow -->
    <path d="M 500 140 L 515 140" stroke="#D7FF2F" stroke-width="2" stroke-linecap="round"/>

    <!-- Stage 3 -->
    <rect x="530" y="0" width="220" height="280" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
    <rect x="546" y="20" width="8" height="8" rx="4" fill="#A855F7"/>
    <text x="562" y="28" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="13" font-weight="700">3. TWO-LANE</text>
    <text x="546" y="65" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Masked Privacy</text>
    <text x="546" y="95" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Anti-Poaching Lock</text>
    <text x="546" y="118" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Assigned Editor Lane</text>
    <text x="546" y="141" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Private Team Lane</text>
    <rect x="546" y="220" width="188" height="36" rx="8" fill="#A855F7" fill-opacity="0.1"/>
    <text x="640" y="243" fill="#C084FC" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Client Protected</text>

    <!-- Arrow -->
    <path d="M 765 140 L 780 140" stroke="#D7FF2F" stroke-width="2" stroke-linecap="round"/>

    <!-- Stage 4 -->
    <rect x="795" y="0" width="240" height="280" rx="12" fill="url(#card-grad)" stroke="#D7FF2F" stroke-width="1.5"/>
    <rect x="811" y="20" width="8" height="8" rx="4" fill="#D7FF2F"/>
    <text x="827" y="28" fill="#D7FF2F" font-family="system-ui, sans-serif" font-size="13" font-weight="700">4. CLOSE &amp; DELIVER</text>
    <text x="811" y="65" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Retainer Locked</text>
    <text x="811" y="95" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Monthly Recurring</text>
    <text x="811" y="118" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">0% Platform Fee</text>
    <text x="811" y="141" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Production Dispatched</text>
    <rect x="811" y="220" width="208" height="36" rx="8" fill="#D7FF2F"/>
    <text x="915" y="243" fill="#0B0F17" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">100% REVENUE KEPT</text>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(80, 565)">
    <text x="0" y="20" fill="#64748B" font-family="system-ui, sans-serif" font-size="13">PILLAR: CLIENT ACQUISITION</text>
    <text x="350" y="20" fill="#64748B" font-family="system-ui, sans-serif" font-size="13">STATUS: B2B VERIFIED</text>
    <text x="650" y="20" fill="#64748B" font-family="system-ui, sans-serif" font-size="13">COMMISSION: 0% PLATFORM CUT</text>
    <text x="970" y="20" fill="#D7FF2F" font-family="system-ui, sans-serif" font-size="13" font-weight="700">GIGXOMI.COM</text>
  </g>
</svg>
