server {
    server_name app.gigxomi.com;

    # WhatsApp ingress isolated process (port 3001)
    location = /webhooks/whatsapp {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Meta Webhooks to Next.js
    location = /api/meta/whatsapp/webhook {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/meta/instagram/webhook {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Unbuffered real-time SSE for instant chat events
    location ~ ^/api/conversations/(events|realtime) {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
    }

    # Strict Robots.txt: completely disallow search crawlers on app.gigxomi.com
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Block sitemaps on app subdomain
    location ~* ^/sitemap.*\.xml$ {
        return 404;
    }

    # Root route on app subdomain redirects directly to login
    location = / {
        return 302 /login;
    }

    # All marketing, landing, knowledge base, blogs, pricing & public directory pages
    # redirect permanently (301) to canonical public site www.gigxomi.com
    location ~* ^/(blog|knowledge-base|pricing|features|for-video-editing-agencies|for-freelance-editors-building-teams|mobile|agencies|freelancers|agency-growth|product|motion|demo|discover|services|contact|codedocs|disclaimer|privacy-policy|refund-and-cancellation-policy|service-delivery-policy|terms-and-conditions|webinar|go|r|meta)(/.*)?$ {
        return 301 https://www.gigxomi.com$request_uri;
    }

    # Application, Auth, Dashboard, and API routes served by Next.js
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.gigxomi.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.gigxomi.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = app.gigxomi.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name app.gigxomi.com;
    listen 80;
    return 404; # managed by Certbot
}
