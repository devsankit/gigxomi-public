server {
    server_name blog.gigxomi.com;

    root /var/www/blog;
    index index.php index.html index.htm;

    # Keep the privacy-policy URL in older Play Console listings accessible.
    # Match only the retired page; WordPress articles and APIs stay unchanged.
    location = /privacy-policy-2 {
        return 301 https://gigxomi.com/privacy-policy;
    }

    location = /privacy-policy-2/ {
        return 301 https://gigxomi.com/privacy-policy;
    }

    # Fast edge redirects for legacy marketplace URLs before hitting WordPress PHP-FPM
    location ^~ /service/ {
        rewrite ^/service/(.*)$ https://www.gigxomi.com/services/$1 permanent;
    }

    location = /service {
        return 301 https://www.gigxomi.com/discover;
    }

    location = /service/ {
        return 301 https://www.gigxomi.com/discover;
    }

    location ^~ /services/ {
        return 301 https://www.gigxomi.com/discover;
    }

    location = /services {
        return 301 https://www.gigxomi.com/discover;
    }

    location ^~ /freelancer/ {
        return 301 https://www.gigxomi.com/freelancers;
    }

    location = /freelancer {
        return 301 https://www.gigxomi.com/freelancers;
    }

    location = /home {
        return 301 https://www.gigxomi.com/;
    }

    location = /home/ {
        return 301 https://www.gigxomi.com/;
    }

    # 0.1ms edge redirect for legacy WordPress tags (1,041 tags) to prevent PHP-FPM load
    location ^~ /tag/ {
        return 301 https://www.gigxomi.com/blog;
    }

    location = /tag {
        return 301 https://www.gigxomi.com/blog;
    }

    location = /robots.txt {
        default_type text/plain;
        add_header X-Robots-Tag "noindex, follow" always;
        return 200 "User-agent: *\nAllow: /\nSitemap: https://www.gigxomi.com/sitemap.xml\n";
    }

    location ~* ^/[^/]*sitemap[^/]*\.xml$ {
        return 301 https://www.gigxomi.com/sitemap.xml;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
    }

    location ~ /\.ht {
        deny all;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gigxomi.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gigxomi.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = blog.gigxomi.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name blog.gigxomi.com;
    return 404; # managed by Certbot
}
